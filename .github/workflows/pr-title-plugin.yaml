name: PR Title — Conventional Commits

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    name: PR Title Check
    steps:
      - name: Validate Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            The subject "{subject}" is empty.
            Please provide a meaningful description.
