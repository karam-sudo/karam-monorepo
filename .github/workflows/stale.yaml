name: Close stale issues and PRs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 5
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed in 5 days if no
            further activity occurs. If this is still relevant, please leave
            a comment.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not
            had recent activity. It will be closed in 5 days if no further
            activity occurs. Please rebase if needed and leave a comment.
